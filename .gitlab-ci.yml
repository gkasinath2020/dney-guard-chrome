# DNey Guard for Claude — CI. Per-MR: typecheck + unit tests + build.
stages:
  - test

default:
  image: node:20
  before_script:
    - npm ci

verify:
  stage: test
  script:
    - npm run typecheck
    - npm test
    - npm run build
  artifacts:
    when: on_success
    paths:
      - dist/
    expire_in: 1 week
